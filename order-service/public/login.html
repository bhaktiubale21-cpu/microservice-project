<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS HUB - Authentication Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 font-sans text-slate-200 antialiased flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
    
    <!-- Header -->
    <div class="p-8 border-b border-slate-800 text-center bg-slate-900/50">
      <div class="inline-flex p-3 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-600/30 mb-3">
        <i class="fa-solid fa-shield-halved text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold text-white tracking-wide">NEXUS OPERATIONS</h1>
      <p class="text-xs text-slate-400 mt-1">Enterprise Microservices Gateway</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="p-8 space-y-5">
      <div id="errorMessage" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center font-medium">
        Invalid credentials
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Operator Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
            <i class="fa-solid fa-user text-xs"></i>
          </span>
          <input type="text" id="username" required value="admin" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-xs text-white outline-none focus:border-indigo-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Access Token / Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
            <i class="fa-solid fa-lock text-xs"></i>
          </span>
          <input type="password" id="password" required value="admin123" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-3 pl-10 pr-4 text-xs text-white outline-none focus:border-indigo-500 transition">
        </div>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
        <span>Authenticate Terminal</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="px-8 py-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-500">
      <span class="flex items-center space-x-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>Gateway Operational</span>
      </span>
      <span class="font-mono">Demo: admin / admin123</span>
    </div>

  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorMessage');
      errBox.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          errBox.innerText = data.message || 'Authentication failed';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = 'Unable to establish gateway connection';
        errBox.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
